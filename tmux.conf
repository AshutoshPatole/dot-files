# tmux config — source: ~/dot-files/tmux.conf -> ~/.tmux.conf
# reload with: <prefix> + r   (or: tmux source-file ~/.tmux.conf)

# ── Leader ──────────────────────────────────────────────
# Use Ctrl-a instead of default Ctrl-b (screen-style, easier to reach).
# `send-prefix` lets you press Ctrl-a twice to send a literal Ctrl-a to the app.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc,xterm-kitty:Tc,wezterm:Tc"
set -g history-limit 50000
set -s escape-time 10          # snappy Esc, still friendly to Neovim/Vim
set -g focus-events on
set -g aggressive-resize on
set -g renumber-windows on     # keep window numbers compact when one closes
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g display-time 2000

# ── Mouse ───────────────────────────────────────────────
set -g mouse on
# click on a window name in the status bar to select it,
# drag to resize panes, scroll to enter copy-mode automatically.

# ── Sessions: <prefix> + s ─────────────────────────────
# Interactive session/window picker (with preview, -Z zooms it).
bind s choose-tree -Zs
# Extras (handy companions):
bind S command-prompt -p "new session:" "new-session -s '%%'"  # <prefix> + S: create session
bind X confirm-before -p "kill session #S? (y/n)" kill-session # <prefix> + X: kill session
bind w choose-tree -Zw                                        # <prefix> + w: window picker

# ── Windows & panes (open in current path) ──────────────
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"  # <prefix> + | : vertical split
bind - split-window -v -c "#{pane_current_path}"  # <prefix> + - : horizontal split
unbind '"'
unbind %

# Vim-style pane movement / resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# ── Copy mode / clipboard ───────────────────────────────
setw -g mode-keys vi
set -g set-clipboard on        # use OSC-52 to talk to the system clipboard
set -g allow-passthrough on    # lets apps (e.g. Neovim) pass OSC-52 through tmux

# Enter copy-mode with <prefix> + [ (default), plus handy <prefix> + v / Escape
bind v copy-mode
bind Escape copy-mode

# vi-style selection inside copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

# macOS (pbcopy/pbpaste) — yanks + mouse-drags go to the system clipboard
if-shell "command -v pbcopy >/dev/null 2>&1" {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
}
# Linux: wl-copy (Wayland) preferred, then xclip / xsel (X11)
if-shell "command -v wl-copy >/dev/null 2>&1" {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
} {
  if-shell "command -v xclip >/dev/null 2>&1" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
    bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  } {
    if-shell "command -v xsel >/dev/null 2>&1" {
      bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard --input"
      bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel --clipboard --input"
      bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel --clipboard --input"
    }
  }
}

# Paste from tmux buffer / system clipboard:
#   <prefix> + p  -> paste tmux buffer
#   <prefix> + P  -> pull from system clipboard into tmux, then paste (macOS pbpaste)
bind p paste-buffer
if-shell "command -v pbpaste >/dev/null 2>&1" {
  bind P run "pbpaste | tmux load-buffer - && tmux paste-buffer"
}

# Keep double-click word selection inside copy-mode and copy it (scalars vary by terminal)
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy" \; send -X clear-selection

# Without copy-mode: middle-click / Shift-select still works in most terminals.

# ── QoL ─────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded!"
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind & confirm-before -p "kill window #W? (y/n)" kill-window
bind d detach-client   # like stock tmux; keeps sessions alive in background

# ── Status bar & aesthetics (Catppuccin Mocha) ───────────
set -g status-position bottom
set -g status-justify left
set -g status-interval 3

# Main bar styling (dark mantle base)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message popup & command prompt style
set -g message-style "fg=#cdd6f4,bg=#313244,bold"
set -g message-command-style "fg=#cdd6f4,bg=#313244,bold"

# Copy mode & clock styling
setw -g mode-style "fg=#11111b,bg=#cba6f7,bold"
setw -g clock-mode-colour "#cba6f7"

# Generous limits so nothing gets truncated
set -g status-left-length 100
set -g status-right-length 120

# ── Left: Session badge (lights up Peach/Amber when Prefix is pressed!) ──
set -g status-left "#{?client_prefix,#[fg=#fab387]#[bg=#1e1e2e]#[fg=#11111b]#[bg=#fab387]#[bold] 󰘳 #S #[fg=#fab387]#[bg=#1e1e2e] ,#[fg=#cba6f7]#[bg=#1e1e2e]#[fg=#11111b]#[bg=#cba6f7]#[bold]  #S #[fg=#cba6f7]#[bg=#1e1e2e] } "

# ── Center / Window tabs (floating dual-tone pill style) ──
setw -g window-status-separator " "

# Inactive window: subdued dark capsule with subtle index
setw -g window-status-format "#[fg=#313244]#[bg=#1e1e2e]#[fg=#a6adc8]#[bg=#313244]#I#[fg=#313244]#[bg=#181825]#[fg=#a6adc8]#[bg=#181825] #W#{?window_bell_flag, #[fg=#f38ba8]󰂞 ,}#[fg=#181825]#[bg=#1e1e2e]"

# Active window: vibrant blue capsule with prominent index + zoom alert
setw -g window-status-current-format "#[fg=#89b4fa]#[bg=#1e1e2e]#[fg=#11111b]#[bg=#89b4fa]#[bold]#I#[fg=#89b4fa]#[bg=#313244]#[fg=#cdd6f4]#[bg=#313244]#[bold] #W#{?window_zoomed_flag, #[fg=#fab387]󰁌 , }#[fg=#313244]#[bg=#1e1e2e]"

# ── Right: Indicators (Sync/Zoom) + Directory + Time + Host ──
set -g status-right "#{?pane_synchronized,#[fg=#f38ba8]#[bg=#1e1e2e]#[fg=#11111b]#[bg=#f38ba8]#[bold]󰓦 SYNC#[fg=#f38ba8]#[bg=#1e1e2e] ,}#{?window_zoomed_flag,#[fg=#fab387]#[bg=#1e1e2e]#[fg=#11111b]#[bg=#fab387]#[bold]󰁌 ZOOM#[fg=#fab387]#[bg=#1e1e2e] ,}#[fg=#313244]#[bg=#1e1e2e]#[fg=#89b4fa]#[bg=#313244] #[fg=#cdd6f4]#[bg=#313244]#{b:pane_current_path} #[fg=#313244]#[bg=#1e1e2e] #[fg=#313244]#[bg=#1e1e2e]#[fg=#fab387]#[bg=#313244]󰃭 #[fg=#cdd6f4]#[bg=#313244]%b %d #[fg=#585b70]│ #[fg=#a6e3a1]#[bg=#313244]󰥔 #[fg=#cdd6f4]#[bg=#313244]%H:%M #[fg=#313244]#[bg=#1e1e2e] #[fg=#b4befe]#[bg=#1e1e2e]#[fg=#11111b]#[bg=#b4befe]#[bold] #h #[fg=#b4befe]#[bg=#1e1e2e]"

